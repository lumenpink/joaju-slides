[package]
name = "joaju-slides"
version = "0.1.0"
edition = "2021"
description = "Presentation slides, handouts, and speaker notes generator from Markdown via Typst"
license = "Apache-2.0"
repository = "https://codeberg.org/lumenpink/joaju-slides"
homepage = "https://codeberg.org/lumenpink/joaju-slides"
documentation = "https://docs.rs/joaju-slides"
readme = "README.md"
keywords = ["typst", "slides", "presentation", "handout", "markdown"]
categories = ["text-processing", "rendering", "command-line-utilities"]
authors = ["Lumen Pink <hi@lumen.pink>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "joaju-slides"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "joaju_slides"
path = "src/lib.rs"
